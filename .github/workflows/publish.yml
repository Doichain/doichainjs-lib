name: Publish to npm

# Publishes the package when a GitHub release is published. npm trusted
# publishing authenticates this workflow through OIDC, so no npm token is
# stored anywhere, and npm attaches a provenance attestation to the release.
#
# Set up once:
# - npmjs.com, package settings of @doichain/doichainjs-lib, trusted publisher:
#   GitHub Actions, organization Doichain, repository doichainjs-lib,
#   workflow publish.yml, environment npm
# - this repository: the environment npm, deployments limited to v* tags

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Check the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag $TAG does not match version $version in package.json"
            exit 1
          fi
          case "$version" in
            *-*) prerelease_version=true ;;
            *) prerelease_version=false ;;
          esac
          if [ "$PRERELEASE" != "$prerelease_version" ]; then
            echo "::error::Mark the GitHub release as a pre-release exactly when $version is a pre-release version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The release commit $GITHUB_SHA is not on master"
            exit 1
          fi
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is too old for trusted publishing, which needs 11.5.1"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run lint:tests
      - name: Check that src/ was built from ts_src/
        run: git diff --exit-code
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            npm publish --tag next
          else
            npm publish
          fi
